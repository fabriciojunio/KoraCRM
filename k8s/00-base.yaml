# Espaço, configuração e segredo.
#
# O segredo aqui é um gabarito com valor vazio: quem publica preenche pelo
# gerenciador de segredo do cluster (External Secrets, Sealed Secrets ou o
# que a casa usar). Segredo de verdade não entra em repositório.
apiVersion: v1
kind: Namespace
metadata:
  name: koracrm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: koracrm-config
  namespace: koracrm
data:
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: https://crm.exemplo.com.br
  APP_TIMEZONE: America/Sao_Paulo
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: koracrm-mysql
  DB_PORT: '3306'
  DB_DATABASE: koracrm
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: koracrm-redis
  REDIS_PORT: '6379'
  FILESYSTEM_DISK: s3
  AWS_DEFAULT_REGION: sa-east-1
  AWS_BUCKET: koracrm-uploads
  FRONTEND_URL: https://crm.exemplo.com.br
  L5_SWAGGER_GENERATE_ALWAYS: 'false'
---
apiVersion: v1
kind: Secret
metadata:
  name: koracrm-secret
  namespace: koracrm
type: Opaque
stringData:
  APP_KEY: ''
  DB_USERNAME: ''
  DB_PASSWORD: ''
  AWS_ACCESS_KEY_ID: ''
  AWS_SECRET_ACCESS_KEY: ''
