# O frontend e a entrada HTTP.
#
# A imagem é Nginx com os arquivos estáticos dentro, rodando sem privilégio na
# porta 8080. O ingress manda /api para a borda da API e o resto para cá.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koracrm-web
  namespace: koracrm
  labels:
    app: koracrm-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: koracrm-web
  template:
    metadata:
      labels:
        app: koracrm-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: koracrm-web:1.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: koracrm-web
  namespace: koracrm
spec:
  selector:
    app: koracrm-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: koracrm
  namespace: koracrm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [crm.exemplo.com.br]
      secretName: koracrm-tls
  rules:
    - host: crm.exemplo.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: koracrm-web
                port:
                  number: 80
