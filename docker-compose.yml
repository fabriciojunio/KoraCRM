# Ambiente local completo: banco, cache, API, frontend, worker de fila e o
# Nginx na frente.
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec backend php artisan migrate --seed
#
# Para trabalhar o upload sem conta na AWS, suba o S3 falso:
#
#   docker compose --profile aws up -d localstack
#   docker compose exec backend php artisan s3:preparar-local
#
# Os testes do backend rodam em SQLite na memória, então não precisam de
# banco no ar: docker compose exec backend php artisan test.

name: koracrm

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: koracrm-nginx
    ports:
      - '80:80'
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: desenvolvimento
    container_name: koracrm-backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: desenvolvimento
    container_name: koracrm-frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost/api
      CHOKIDAR_USEPOLLING: 'true'
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: koracrm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_DATABASE:-koracrm}
      MYSQL_USER: ${DB_USERNAME:-koracrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - '3306:3306'
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: koracrm-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ''
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      target: desenvolvimento
    container_name: koracrm-worker
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Só sobe com --profile aws. É a AWS de mentira: dá para exercitar o upload
  # para o S3, a URL assinada e a exclusão da LGPD sem conta e sem cobrança.
  localstack:
    image: localstack/localstack:3.8
    container_name: koracrm-localstack
    profiles: ['aws']
    environment:
      SERVICES: s3
      DEBUG: '0'
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql:
