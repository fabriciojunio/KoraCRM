name: KoraCRM Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificar-backend:
    name: Verificar Backend PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --no-progress --ignore-platform-reqs --no-scripts

  verificar-frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [verificar-backend, verificar-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Criar registro de deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          initial-status: in_progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy para Vercel
        working-directory: frontend
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_SEbBZxQ9aO2or7wcwtT2qt41
          VERCEL_PROJECT_ID: prj_ixyMAElttoBiQRZBZbrkEZBIopYR

      - name: Atualizar status do deployment (sucesso)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://koracrm-frontend.vercel.app

      - name: Atualizar status do deployment (falha)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
